<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Secure Login — Account Verification</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: min(380px, 92vw);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 18px; color: #94a3b8; font-size: 13px; line-height: 1.5; }
    label { display: block; font-size: 12px; margin-bottom: 6px; color: #cbd5e1; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SAP SSO — Verify Account</h1>
    <p>Your session expired. Re-authenticate to restore enterprise access.</p>
    <form onsubmit="event.preventDefault(); alert('Demo only');">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" />
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" />
      <button type="submit">Continue to SAP</button>
    </form>
  </div>
</body>
</html>
